
name: SUPER EXPRESS Customer Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'android-customer.zip (1).zip'
      - '.github/workflows/android-build.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract Android project
        run: |
          unzip -q "android-customer.zip (1).zip" -d extracted
          GRADLEW=$(find extracted -type f -name gradlew | head -n 1)
          if [ -z "$GRADLEW" ]; then
            echo "Gradle wrapper not found"
            exit 1
          fi
          echo "PROJECT_DIR=$(dirname "$GRADLEW")" >> $GITHUB_ENV

      - name: Increase Gradle memory
        run: |
          touch "$PROJECT_DIR/gradle.properties"
          sed -i '/^org.gradle.jvmargs=/d' "$PROJECT_DIR/gradle.properties"
          sed -i '/^org.gradle.workers.max=/d' "$PROJECT_DIR/gradle.properties"
          sed -i '/^org.gradle.parallel=/d' "$PROJECT_DIR/gradle.properties"
          {
            echo 'org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8'
            echo 'org.gradle.workers.max=2'
            echo 'org.gradle.parallel=false'
          } >> "$PROJECT_DIR/gradle.properties"

      - name: Build Customer APK
        run: |
          chmod +x "$PROJECT_DIR/gradlew"
          cd "$PROJECT_DIR"
          ./gradlew assembleDebug

      - name: Upload Customer APK
        uses: actions/upload-artifact@v4
        with:
          name: super-express-customer-apk
          path: extracted/**/app/build/outputs/apk/debug/*.apk
          

